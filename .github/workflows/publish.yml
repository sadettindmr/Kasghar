# Release'e yüklenen çok mimarili OCI arşivini GitHub Container Registry'ye yayınlar.
name: Publish image
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 3.0.0)"
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download image archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p "kasghar-$VERSION-oci.tar*"
          sha256sum -c "kasghar-$VERSION-oci.tar.sha256"
      - name: Push to GHCR
        env:
          VERSION: ${{ inputs.version }}
          TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$VERSION" latest; do
            skopeo copy --all --retry-times 3 "oci-archive:kasghar-$VERSION-oci.tar" "docker://$image:$tag"
          done
